<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>유튜브 썸네일 디자이너 | 의뢰 받습니다</title>
  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #121212; /* 배경색 */
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 500px; /* 이미지 최대 너비 설정 */
            width: 100%;
            padding: 16px;
            text-align: center;
        }
        .banner-link {
            display: block;
            text-decoration: none;
        }
        .banner-img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .btn-telegram {
            display: inline-block;
            width: 100%;
            margin-top: 15px;
            padding: 16px 0;
            background-color: #2b2b2b;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            transition: background-color 0.2s;
        }
        .btn-telegram:hover {
            background-color: #3b3b3b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 이미지 클릭 시 텔레그램으로 이동 -->
        <a href="https://t.me/DFVYL" target="_blank" class="banner-link">
            <!-- 깃허브에 올린 이미지 파일명을 src에 적어주세요 (예: 23.png) -->
            <img src="26.png" alt="상담 안내" class="banner-img">
        </a>

        <!-- 하단 바로가기 버튼 -->
        <a href="https://t.me/DFVYL" target="_blank" class="btn-telegram">
            바로가기 &rarr; 텔레그램 문의
        </a>
    </div>

</body>
</html>
